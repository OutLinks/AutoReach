services:
  - type: web
    name: autoreach-api
    runtime: docker
    plan: starter
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    maxShutdownDelaySeconds: 300
    disk:
      name: autoreach-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: AUTOREACH_ENV
        value: production
      - key: AUTOREACH_DATA_DIR
        value: /data
      - key: AUTOREACH_SCHEDULER_INTERVAL_SECONDS
        value: 30
