name: CI/CD

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: janudax/autoreach

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip -r requirements.txt

      - name: Run test suite
        run: python -m unittest discover -s tests -v

  publish:
    name: Publish Docker image
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    outputs:
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Sign in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    concurrency:
      group: autoreach-production
      cancel-in-progress: false

    steps:
      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "$HOME/.ssh/autoreach-deploy"
          chmod 600 "$HOME/.ssh/autoreach-deploy"
          ssh-keyscan -p "${VPS_PORT:-22}" -H "$VPS_HOST" \
            >> "$HOME/.ssh/known_hosts"

      - name: Pull and restart AutoReach
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh \
            -i "$HOME/.ssh/autoreach-deploy" \
            -p "${VPS_PORT:-22}" \
            "$VPS_USER@$VPS_HOST" \
            'bash -se' <<'REMOTE'
          set -Eeuo pipefail
          cd /root/outreach-agent

          docker compose pull autoreach
          docker compose up -d --force-recreate autoreach

          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8000/healthz; then
              docker compose ps
              exit 0
            fi
            sleep 3
          done

          docker compose logs --tail=100 autoreach
          exit 1
          REMOTE

      - name: Remove SSH key
        if: always()
        run: rm -f "$HOME/.ssh/autoreach-deploy"
